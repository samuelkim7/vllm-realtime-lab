[project]
name = "vllm-realtime-lab"
version = "0.1.0"
description = "vLLM latency tuning for real-time workloads, hunting down milliseconds with caching, quantization and speculative decoding"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Kim", email = "samuelmwkim@gmail.com" }]
keywords = ["vllm", "llm", "inference", "latency", "voice-agent", "benchmark"]
dependencies = [
    "msgspec>=0.19,<1.0",
]

[project.urls]
Repository = "https://github.com/samuelkim7/vllm-realtime-lab"

[dependency-groups]
dev = [
    "modal>=1.5,<2",
    "mypy>=2.3,<3",
    "pre-commit>=4.6,<5",
    "pytest>=9.1,<10",
    "ruff>=0.16.5,<0.17",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]
markers = [
    "live: requires a running vLLM endpoint (deselected in CI)",
]
